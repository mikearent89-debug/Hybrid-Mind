[project]
name = "memory-worker"
version = "0.0.0"
description = "The Python side of Solar Portfolio Memory: parses documents, chunks and embeds them, asks Claude to extract candidates, and submits everything to memory-api. It never writes the database."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pypdf>=6.21.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.35",
    "pytest>=8.3",
    "ruff>=0.12",
]

[project.scripts]
memory-worker = "memory_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_worker"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["memory_worker/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
